<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>demonst — 인디 메이커 앱 테스트 & 런치패드</title>
    <meta name="description" content="demonst — 사이드 프로젝트와 인디 메이커를 위한 앱 테스트 & 런치패드 플랫폼" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body class="bg-surface text-fg font-sans antialiased min-h-screen">
    <div id="root"></div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          try {
            var el = document.getElementById('google_translate_element');
            if (el && el.children.length === 0) {
              new window.google.translate.TranslateElement(
                {
                  pageLanguage: 'ko',
                  layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
                  autoDisplay: false
                },
                'google_translate_element'
              );
            }
          } catch (e) {
            console.warn('Google Translate init error:', e);
          }
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
